name: One-time OS review formatting
on:
  push:
    branches:
      - content/operating-systems-week-01
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format review note and remove this workflow
        run: |
          npx prettier --write docs/os-week-01-source-review.md
          rm .github/workflows/os-format-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/os-week-01-source-review.md .github/workflows/os-format-review.yml
          git diff --cached --quiet || git commit -m "style(os): format source review note"
          git push
