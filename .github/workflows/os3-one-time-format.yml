name: One-time OS Week 03 formatting
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only week three content and remove this workflow
        run: |
          npx prettier --write content/courses/operating-systems/course.json content/topics/os3-*/*.md content/topics/os3-*/topic.json content/glossary.json content/sources.json docs/os-week-03-source-review.md
          rm .github/workflows/os3-one-time-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/courses/operating-systems/course.json content/topics/os3-*/*.md content/topics/os3-*/topic.json content/glossary.json content/sources.json docs/os-week-03-source-review.md .github/workflows/os3-one-time-format.yml
          git diff --cached --quiet || git commit -m "style(os): format week three content"
          git push
