name: One-time content formatting
on:
  push:
    branches:
      - content/operating-systems-week-01
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format course content and remove this temporary workflow
        run: |
          npx prettier --write content/
          rm .github/workflows/os-one-time-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ .github/workflows/os-one-time-format.yml
          git diff --cached --quiet || git commit -m "style: normalize content formatting"
          git push
